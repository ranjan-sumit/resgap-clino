[pytest]
testpaths = tests
markers =
    ui: Streamlit AppTest / browser-level tests (slower)
    e2e: Playwright browser tests (nightly; need `playwright install chromium`)
    real: calls a real model provider and spends tokens (never run in CI)
    slow: takes minutes (memory and load budgets); runs nightly, not on every change
addopts = -m "not e2e and not real and not slow"
