# The app, hardened. Usage:  cp .env.example .env   (fill in the keys)   then   docker compose up -d --build
#
# * Data (run history, projects, backups) is in the named volume `data`; nothing is bind-mounted from the source tree.
# * The port is published on this machine only. Put a reverse proxy with TLS and sign-in in front of it before anyone else
#   connects; the app has no sign-in of its own.
# * The container is read-only, runs without privileges and without capabilities, with memory and process limits.
# * Cross-site request protection and CORS are left on (the previous file switched them off).
# * Settings that matter in a controlled deployment can be set in .env: RESGAP_ALLOWED_PROVIDERS, RESGAP_ALLOWED_HOSTS,
#   RESGAP_ERASE_ON_DELETE (see DEPLOY.md).
# For development with the code mounted and auto-reload, add:  -f docker-compose.dev.yml

services:
  app:
    image: clinova:local
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - data:/data
    read_only: true
    tmpfs:
      - /tmp
      - /home/app
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 3g
    pids_limit: 256
    restart: unless-stopped

volumes:
  data:
