name: clinova

# Streamlit-only local stack. Usage:  docker compose up -d --build
#
# No database service: run history and graph snapshots live in one SQLite
# file (data/run_history.db, utils/database.py), persisted by the ./data bind
# mount below. Postgres and ArcadeDB were removed 2026-10-09; the Next.js/
# FastAPI services were archived earlier under _archive/react-fastapi-stack/.

services:
  streamlit:
    image: clinova-python:latest
    build:
      context: .
      dockerfile: Dockerfile.api
    command: streamlit run app.py --server.address=0.0.0.0 --server.port=8501 --server.enableCORS false --server.enableXsrfProtection false
    working_dir: /app
    env_file: .env
    volumes:
      - .:/app
    ports:
      - "8501:8501"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8501/healthz',timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped
