# Compat copy of docker-compose.yml (untracked) — identical except the top-level
# `name:` key is removed, which the compose parser available on this host rejects.
# Use -p clinova to get the same project/container names as the original.
#
# Streamlit-only: api/web (Next.js/FastAPI) archived under
# _archive/react-fastapi-stack/ — see docker-compose.yml's header comment.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clinova_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DATABASE:-clinova}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  arcadedb:
    image: arcadedata/arcadedb:latest
    environment:
      JAVA_OPTS: "-Darcadedb.server.rootPassword=${ARCADEDB_PASSWORD:-clinova_arcade_dev}"
    ports:
      - "2480:2480"
    volumes:
      - arcadedata:/home/arcadedb/databases
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:2480/api/v1/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  streamlit:
    image: clinova-python:latest
    build:
      context: .
      dockerfile: Dockerfile.api
    command: streamlit run app.py --server.address=0.0.0.0 --server.port=8501 --server.enableCORS false --server.enableXsrfProtection false
    working_dir: /app
    env_file: .env
    environment:
      POSTGRES_URL: postgresql://postgres:5432
      ARCADEDB_URL: http://arcadedb:2480
    volumes:
      - .:/app
    ports:
      - "8501:8501"
    depends_on:
      postgres:
        condition: service_healthy
      arcadedb:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8501/healthz',timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

volumes:
  pgdata:
  arcadedata:
